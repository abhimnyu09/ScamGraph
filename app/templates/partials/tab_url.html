<form hx-post="/extract-url" hx-target="#url-result" hx-swap="innerHTML" hx-indicator="#url-spinner" class="space-y-6">
    <div>
        <label for="url" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Job Posting URL
        </label>
        <div class="flex gap-2">
            <input type="url" name="url" id="url" required
                placeholder="https://linkedin.com/jobs/view/... or https://naukri.com/job-listings-..."
                class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
            <button type="submit"
                class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 transition flex items-center gap-2"
                id="url-spinner">
                <span class="htmx-indicator">
                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </span>
                <span class="htmx-indicator:hidden">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    Extract
                </span>
            </button>
        </div>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
            Supported: LinkedIn, Naukri, Indeed, Glassdoor, company careers pages (Greenhouse, Lever, Workday, etc.)
        </p>
    </div>

    <div id="url-result">
        <!-- Extracted job details will appear here -->
    </div>
</form>

<!-- Prefilled form (returned after successful extraction) -->
<div id="prefilled-form-container" class="hidden"></div>
